apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-service-istio
  namespace: argocd
  # Session 21 — GitOps sync for all Istio mesh resources.
  # ArgoCD watches k8s/istio/ and applies changes automatically.
  # This means: changing the weight in product-service-vs.yaml and pushing
  # to git will shift traffic without any kubectl commands.
spec:
  project: default
  source:
    repoURL: https://github.com/M7mdselim/Ecommerce-Project
    targetRevision: HEAD
    path: k8s/istio
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
