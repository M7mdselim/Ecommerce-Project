{{- if .Values.istio.enabled }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
spec:
  mtls:
    mode: {{ .Values.istio.mTLS.mode }}
{{- end }}
