server:
  port: 8080

# ── JWT / OAuth2 Resource Server ─────────────────────────────────────────────
# The gateway validates incoming JWTs using this shared HMAC-256 secret.
# Session 20: JwtAuthFilter + JwtUtil deleted; replaced by Spring Security
# oauth2-resource-server (see SecurityConfig.java).
jwt:
  secret: ${JWT_SECRET:microservices-pro-course-secret-key-2024-minimum-256-bits}

spring:
  application:
    name: api-gateway
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  
  # Redis Reactive configuration for RequestRateLimiter
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # Spring Cloud Gateway routing configurations
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products, /api/products/**
          filters:
            # Rewrites client request path from /api/products to /api/v1/products
            - RewritePath=/api/products(?<segment>.*), /api/v1/products$1
            - AddResponseHeader=X-Platform, microservices-pro
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders, /api/orders/**

        # ADMIN-only route — SecurityConfig enforces ROLE_ADMIN; customers get 403
        - id: order-service-admin
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/admin/**

        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/v1/inventory/**

# Eureka Client Discovery Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Spring Boot Actuator & Tracing Management Configurations
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus