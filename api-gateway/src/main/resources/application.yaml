server:
  port: 8080

# JWT Configuration
jwt:
  secret: microservices-pro-course-secret-key-2024-minimum-256-bits

spring:
  application:
    name: api-gateway
  
  # Redis Reactive configuration for RequestRateLimiter
  data:
    redis:
      host: localhost
      port: 6379

  # Spring Cloud Gateway routing configurations
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**
          filters:
            # Rewrites client request path from /api/products/* to backend /api/v1/products/*
            - RewritePath=/api/products(?<segment>.*), /api/v1/products$\{segment}
            - AddResponseHeader=X-Platform, microservices-pro
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

# Eureka Client Discovery Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Spring Boot Actuator Management Configurations
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway